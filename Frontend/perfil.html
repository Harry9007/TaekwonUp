<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Perfil | Taek WonUp</title>

    <link rel="stylesheet" href="css/estilos.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

    <div class="dashboard">

        <!-- ========================= -->
        <!-- ENCABEZADO -->
        <!-- ========================= -->

        <header>

            <h1>

                <i class="fa-solid fa-user"></i>

                Mi Perfil

            </h1>

            <button id="volver">

                <i class="fa-solid fa-arrow-left"></i>

                Dashboard

            </button>

        </header>


        <!-- ========================= -->
        <!-- INFORMACIÓN PERSONAL -->
        <!-- ========================= -->

        <section class="card">

            <i class="fa-solid fa-id-card icono"></i>

            <h2>

                Información personal

            </h2>


            <p>

                <strong>Nombre:</strong>

                <span id="nombre">
                    Cargando...
                </span>

            </p>


            <p>

                <strong>Documento:</strong>

                <span id="documento">
                    Cargando...
                </span>

            </p>


            <p>

                <strong>Edad:</strong>

                <span id="edad">
                    Cargando...
                </span>

            </p>


            <p>

                <strong>Sexo:</strong>

                <span id="sexo">
                    Cargando...
                </span>

            </p>


            <p>

                <strong>Correo:</strong>

                <span id="correo">
                    Cargando...
                </span>

            </p>

        </section>


        <!-- ========================= -->
        <!-- INFORMACIÓN DEPORTIVA -->
        <!-- ========================= -->

        <section class="card">

            <i class="fa-solid fa-medal icono"></i>

            <h2>

                Información deportiva

            </h2>


            <p>

                <strong>Nivel actual:</strong>

                <span id="nivel">
                    Cargando...
                </span>

            </p>


            <p>

                <strong>Puntaje:</strong>

                <span id="puntaje">
                    Cargando...
                </span>

            </p>


            <p>

                <strong>Fecha de registro:</strong>

                <span id="fechaRegistro">
                    Cargando...
                </span>

            </p>

        </section>


        <!-- ========================= -->
        <!-- VOLVER -->
        <!-- ========================= -->

        <section class="card">

            <button id="btnVolver">

                <i class="fa-solid fa-house"></i>

                Volver al Dashboard

            </button>

        </section>

    </div>


    <script type="module" src="js/perfil.js"></script>

</body>

</html>
